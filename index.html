<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>熱電対実験装置 ラベルエディタ</title>
<style>
  :root{ --accent:#d61e1e; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:"Noto Sans CJK JP","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",system-ui,sans-serif; background:#f4f4f5; color:#1a1a1a; }
  #bar{ position:sticky; top:0; z-index:50; display:flex; flex-wrap:wrap; gap:8px; align-items:center;
        padding:10px 14px; background:#fff; border-bottom:1px solid #e3e3e6; }
  #bar button{ font:inherit; font-size:14px; padding:7px 12px; border:1px solid #cfcfd4; background:#fff; border-radius:8px; cursor:pointer; }
  #bar button:hover{ background:#f0f0f2; }
  #bar button.primary{ background:var(--accent); color:#fff; border-color:var(--accent); font-weight:700; }
  #bar .hint{ font-size:12.5px; color:#666; margin-left:auto; }
  #wrap{ padding:16px; display:flex; justify-content:center; }
  #stage{ position:relative; display:inline-block; line-height:0; box-shadow:0 4px 24px rgba(0,0,0,.12); }
  #photo{ display:block; max-width:100%; height:auto; -webkit-user-drag:none; user-select:none; }
  #svg{ position:absolute; left:0; top:0; pointer-events:none; }
  .dot{ position:absolute; width:16px; height:16px; border-radius:50%; background:var(--accent);
        border:2px solid #fff; transform:translate(-50%,-50%); cursor:grab; touch-action:none; z-index:30; box-shadow:0 0 0 1px rgba(0,0,0,.15); }
  .dot:active{ cursor:grabbing; }
  .lab{ position:absolute; background:rgba(255,255,255,.93); border:2px solid var(--accent); border-radius:7px;
        color:#111; font-weight:700; white-space:nowrap; line-height:1.3; cursor:grab; touch-action:none; z-index:20; user-select:none; }
  .lab:active{ cursor:grabbing; }
  .lab .x{ position:absolute; top:-10px; right:-10px; width:20px; height:20px; border-radius:50%; background:#444; color:#fff;
           font-size:13px; line-height:18px; text-align:center; cursor:pointer; display:none; border:2px solid #fff; font-weight:700; }
  .lab:hover .x{ display:block; }
</style>
</head>

  <button class="primary" id="dl">PNG をダウンロード</button>
  <button id="add">＋ ラベル追加</button>

  <button id="fplus">A＋</button>
  <button id="reset">配置リセット</button>
  <span class="hint">ラベルもドット（指す点）もドラッグで移動／ダブルクリックで文字編集／右上の×で削除</span>
</div>

<script>
const DEFAULTS = [{"text": "熱電対（クロメル・アルメル線）", "bx": 250, "by": 250, "tx": 440, "ty": 600}, {"text": "加熱炉", "bx": 600, "by": 170, "tx": 585, "ty": 700}, {"text": "ディジタルマルチメータ (DM)", "bx": 700, "by": 330, "tx": 715, "ty": 770}, {"text": "温度調節機", "bx": 40, "by": 430, "tx": 200, "ty": 845}, {"text": "ボルトスライダ (V.S.)", "bx": 40, "by": 520, "tx": 300, "ty": 800}, {"text": "ボルトメータ (V)", "bx": 290, "by": 590, "tx": 425, "ty": 885}, {"text": "デジタル温度計", "bx": 30, "by": 640, "tx": 80, "ty": 925}, {"text": "ついたて", "bx": 800, "by": 210, "tx": 865, "ty": 470}, {"text": "るつぼ（すず）", "bx": 1060, "by": 360, "tx": 1035, "ty": 650}];
const SVGNS = "http://www.w3.org/2000/svg";
let FONT = 27;          // base font in natural px
const PAD_Y = 12, PAD_X = 18;  // padding in natural px
let anns = [];
let scale = 1, NW = 0, NH = 0;

const photo = document.getElementById('photo');
const stage = document.getElementById('stage');
const svg   = document.getElementById('svg');

function clone(a){ return JSON.parse(JSON.stringify(a)); }
function loadDefaults(){ anns = clone(DEFAULTS).map((a,i)=>({...a, id:i+'_'+Date.now()})); buildDOM(); }

function buildDOM(){
  // remove old
  stage.querySelectorAll('.lab,.dot').forEach(e=>e.remove());
  while(svg.firstChild) svg.removeChild(svg.firstChild);
  anns.forEach(a=>{
    const line = document.createElementNS(SVGNS,'line');
    line.setAttribute('stroke','var(--accent)');
    a._line = line; svg.appendChild(line);

    const lab = document.createElement('div');
    lab.className='lab'; lab.textContent=a.text;
    const x = document.createElement('div'); x.className='x'; x.textContent='×';
    lab.appendChild(x);
    a._lab = lab; stage.appendChild(lab);

    const dot = document.createElement('div'); dot.className='dot';
    a._dot = dot; stage.appendChild(dot);

    makeDrag(lab, a, 'box');
    makeDrag(dot, a, 'dot');
    lab.addEventListener('dblclick', e=>{ e.stopPropagation();
      const t = prompt('ラベルの文字', a.text);
      if(t!==null && t.trim()!==''){ a.text=t; lab.firstChild.nodeValue=t; layout(); }
    });
    x.addEventListener('pointerdown', e=>e.stopPropagation());
    x.addEventListener('click', e=>{ e.stopPropagation();
      anns = anns.filter(z=>z!==a);
      a._lab.remove(); a._dot.remove(); a._line.remove();
    });
  });
  layout();
}

function layout(){
  const w = photo.clientWidth, h = photo.clientHeight;
  if(!w){ return; }
  scale = w / NW;
  svg.setAttribute('width', w); svg.setAttribute('height', h);
  svg.style.width = w+'px'; svg.style.height = h+'px';
  anns.forEach(a=>{
    const lab=a._lab, dot=a._dot, line=a._line;
    lab.style.fontSize = (FONT*scale)+'px';
    lab.style.padding = (PAD_Y*scale)+'px '+(PAD_X*scale)+'px';
    lab.style.borderRadius = (7*scale)+'px';
    lab.style.left = (a.bx*scale)+'px';
    lab.style.top  = (a.by*scale)+'px';
    const ds = Math.max(12, 16*scale);
    dot.style.width=ds+'px'; dot.style.height=ds+'px';
    dot.style.left = (a.tx*scale)+'px';
    dot.style.top  = (a.ty*scale)+'px';
    // line: label center -> dot
    const lc = lab.offsetLeft + lab.offsetWidth/2;
    const lcy= lab.offsetTop  + lab.offsetHeight/2;
    line.setAttribute('x1', lc); line.setAttribute('y1', lcy);
    line.setAttribute('x2', a.tx*scale); line.setAttribute('y2', a.ty*scale);
    line.setAttribute('stroke-width', Math.max(2, 3*scale));
  });
}

function makeDrag(el, a, kind){
  el.addEventListener('pointerdown', e=>{
    if(e.target.classList && e.target.classList.contains('x')) return;
    e.preventDefault();
    el.setPointerCapture(e.pointerId);
    const sx=e.clientX, sy=e.clientY;
    const bx0 = (kind==='box')? a.bx : a.tx;
    const by0 = (kind==='box')? a.by : a.ty;
    function mv(ev){
      const dx=(ev.clientX-sx)/scale, dy=(ev.clientY-sy)/scale;
      let nx=bx0+dx, ny=by0+dy;
      nx=Math.max(-40, Math.min(NW+10, nx));
      ny=Math.max(-40, Math.min(NH+10, ny));
      if(kind==='box'){ a.bx=nx; a.by=ny; } else { a.tx=nx; a.ty=ny; }
      layout();
    }
    function up(ev){ el.releasePointerCapture(e.pointerId);
      el.removeEventListener('pointermove',mv); el.removeEventListener('pointerup',up); }
    el.addEventListener('pointermove',mv); el.addEventListener('pointerup',up);
  });
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

function download(){
  const c=document.createElement('canvas'); c.width=NW; c.height=NH;
  const ctx=c.getContext('2d');
  ctx.drawImage(photo,0,0,NW,NH);
  const stack='"Noto Sans CJK JP","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif';
  anns.forEach(a=>{
    const bw=a._lab.offsetWidth/scale, bh=a._lab.offsetHeight/scale;
    const cx=a.bx+bw/2, cy=a.by+bh/2;
    // line
    ctx.strokeStyle='#d61e1e'; ctx.lineWidth=Math.max(2,3*(NW/1477));
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(a.tx,a.ty); ctx.stroke();
    // dot
    ctx.beginPath(); ctx.arc(a.tx,a.ty,8,0,7); ctx.fillStyle='#d61e1e'; ctx.fill();
    ctx.lineWidth=2; ctx.strokeStyle='#fff'; ctx.stroke();
    // box
    ctx.fillStyle='rgba(255,255,255,0.93)';
    ctx.strokeStyle='#d61e1e'; ctx.lineWidth=Math.max(2,3*(NW/1477));
    roundRect(ctx,a.bx,a.by,bw,bh,7); ctx.fill(); ctx.stroke();
    // text
    ctx.fillStyle='#111'; ctx.font='700 '+FONT+'px '+stack;
    ctx.textBaseline='middle'; ctx.textAlign='left';
    ctx.fillText(a.text, a.bx+PAD_X, a.by+bh/2);
  });
  c.toBlob(b=>{
    const url=URL.createObjectURL(b);
    const link=document.createElement('a');
    link.href=url; link.download='熱電対実験装置_ラベル付き.png';
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
  },'image/png');
}

document.getElementById('dl').onclick=download;
document.getElementById('add').onclick=()=>{
  anns.push({text:'ラベル', bx:NW*0.4, by:NH*0.15, tx:NW*0.5, ty:NH*0.5, id:'n'+Date.now()});
  buildDOM();
};
document.getElementById('reset').onclick=loadDefaults;
document.getElementById('fplus').onclick=()=>{ FONT=Math.min(60,FONT+2); layout(); };
document.getElementById('fminus').onclick=()=>{ FONT=Math.max(12,FONT-2); layout(); };
window.addEventListener('resize', layout);

function start(){ NW=photo.naturalWidth; NH=photo.naturalHeight; loadDefaults(); }
if(photo.complete && photo.naturalWidth){ start(); } else { photo.onload=start; }
</script>
